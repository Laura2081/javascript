<body style="background-color: white;">

                            <form>

                        </div>

                    </div>


                    <hr>

                    <button class="btn btn-success" id="boton" type="button">Calcular IMC</button>
                    </form>
                    <p id="resultado-IMC"></p>

                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="app.js"></script>
